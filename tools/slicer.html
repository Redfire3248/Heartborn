<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Heartborn Sprite Slicer</title>
<style>
  :root { --bg:#1b1622; --panel:#2a2233; --line:#4a3d57; --text:#f1e6d2; --dim:#a898b8; --accent:#ff9a3c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; }
  header h1 { margin:0; font-size:18px; color:var(--accent); }
  main { display:grid; grid-template-columns:300px 1fr; gap:20px; padding:20px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; }
  label { display:block; margin:10px 0 4px; color:var(--dim); font-size:12px; }
  select, input[type=number], input[type=range] { width:100%; }
  select, input[type=number] { background:#140f19; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:6px; }
  button { margin-top:10px; width:100%; padding:9px; background:var(--accent); color:#1b1622; border:0; border-radius:4px; font-weight:700; cursor:pointer; }
  button.secondary { background:#4a3d57; color:var(--text); }
  button:disabled { opacity:.4; cursor:default; }
  #drop { border:2px dashed var(--line); border-radius:8px; padding:24px; text-align:center; color:var(--dim); cursor:pointer; }
  #drop.over { border-color:var(--accent); color:var(--text); }
  #source { max-width:100%; image-rendering:pixelated; margin-top:10px; display:none; border:1px solid var(--line); }
  .grid { display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; }
  .cell { background:repeating-conic-gradient(#3a3045 0 25%, #2e2638 0 50%) 0 0/16px 16px; border:1px solid var(--line); border-radius:4px; padding:6px; text-align:center; }
  .cell canvas { width:64px; height:64px; image-rendering:pixelated; display:block; margin:0 auto; }
  .cell span { display:block; font-size:10px; color:var(--dim); margin-top:4px; word-break:break-all; background:var(--panel); border-radius:2px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row input[type=checkbox] { width:auto; }
  #status { margin-top:10px; color:var(--dim); font-size:12px; min-height:1.4em; }
</style>
</head>
<body>
<header><h1>🔥 Heartborn Sprite Slicer</h1><span style="color:var(--dim)">6×6 sheet → 36 × 128px PNGs</span></header>
<main>
  <div class="panel">
    <label>Sheet</label>
    <select id="sheet"></select>

    <div id="drop" style="margin-top:12px">Drop sheet image here<br>or click to choose</div>
    <input id="file" type="file" accept="image/*" hidden>
    <img id="source" alt="">

    <label>Columns × Rows</label>
    <div class="row"><input id="cols" type="number" value="6" min="1"><input id="rows" type="number" value="6" min="1"></div>

    <label>Background tolerance: <b id="tolVal">40</b></label>
    <input id="tol" type="range" min="0" max="120" value="40">

    <label>Cell edge inset % (ignores bleed from neighbours): <b id="insetVal">0</b></label>
    <input id="inset" type="range" min="0" max="15" value="0">

    <label>Padding inside sprite: <b id="padVal">4</b></label>
    <input id="pad" type="range" min="0" max="16" value="4">

    <label class="row"><input id="checker" type="checkbox" checked> Remove fake checkerboard (2 colours)</label>
    <label class="row"><input id="nearest" type="checkbox"> Nearest-neighbour scaling (crisper, noisier)</label>

    <button id="slice" disabled>Slice</button>
    <button id="saveDir" disabled>Save into assets folder…</button>
    <button id="saveZip" class="secondary" disabled>Download ZIP</button>
    <div id="status"></div>
  </div>

  <div class="panel">
    <div id="preview" class="grid"></div>
  </div>
</main>

<script src="sheets.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const OUT = 128;
let img = null;
let results = []; // { name, folder, canvas }

for (const [key, s] of Object.entries(SHEETS)) {
  $('sheet').add(new Option(s.title, key));
}
for (const id of ['tol', 'inset', 'pad']) {
  $(id).addEventListener('input', () => { $(id + 'Val').textContent = $(id).value; if (img) slice(); });
}
for (const id of ['checker', 'nearest', 'cols', 'rows', 'sheet']) {
  $(id).addEventListener('change', () => { if (img) slice(); });
}

// ---------- loading ----------
const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => e.target.files[0] && load(e.target.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && load(e.dataTransfer.files[0]); };

function load(file) {
  const url = URL.createObjectURL(file);
  const el = $('source');
  el.onload = () => { img = el; el.style.display = 'block'; $('slice').disabled = false; slice(); };
  el.src = url;
}

// ---------- slicing ----------
function slice() {
  const sheet = SHEETS[$('sheet').value];
  const cols = +$('cols').value, rows = +$('rows').value;
  const tol = +$('tol').value, insetPct = +$('inset').value / 100, pad = +$('pad').value;

  const W = img.naturalWidth, H = img.naturalHeight;
  const src = document.createElement('canvas');
  src.width = W; src.height = H;
  const sctx = src.getContext('2d', { willReadFrequently: true });
  sctx.drawImage(img, 0, 0);
  const all = sctx.getImageData(0, 0, W, H);

  const hasAlpha = detectAlpha(all);
  const keys = hasAlpha ? [] : borderColors(all, $('checker').checked ? 2 : 1);

  results = [];
  const cw = W / cols;
  const opaqueAt = (x, y) => all.data[(y * W + x) * 4 + 3] > 40;
  const profile = (n, fn) => Array.from({ length: n }, (_, k) => fn(k));
  const rowCuts = hasAlpha
    ? findCuts(profile(H, y => { let s = 0; for (let x = 0; x < W; x++) s += opaqueAt(x, y); return s; }), rows)
    : Array.from({ length: rows + 1 }, (_, k) => Math.round(k * H / rows));
  for (let r = 0; r < rows; r++) {
    const ry0 = rowCuts[r], ry1 = rowCuts[r + 1];
    const colCuts = hasAlpha
      ? findCuts(profile(W, x => { let s = 0; for (let y = ry0; y < ry1; y++) s += opaqueAt(x, y); return s; }), cols)
      : Array.from({ length: cols + 1 }, (_, k) => Math.round(k * cw));
    for (let c = 0; c < cols; c++) {
      const i = r * cols + c;
      const name = sheet.names[i] || `${$('sheet').value}_${i}`;
      const isTile = sheet.tileCount && i < sheet.tileCount;
      // tiles fill their cells, so they use the even grid; sprites use detected gaps
      const cx0 = isTile ? Math.round(c * cw) : colCuts[c];
      const cx1 = isTile ? Math.round((c + 1) * cw) : colCuts[c + 1];
      const ix = Math.round((cx1 - cx0) * insetPct), iy = Math.round((ry1 - ry0) * insetPct);
      const x0 = cx0 + ix, y0 = ry0 + iy;
      const w = cx1 - cx0 - ix * 2, h = ry1 - ry0 - iy * 2;
      const cell = sctx.getImageData(x0, y0, w, h);

      let out;
      if (isTile) {
        out = scaleTo(cell, 0, 0, w, h, OUT, OUT, false);
      } else {
        if (!hasAlpha) floodRemove(cell, keys, tol);
        const box = bounds(cell);
        out = document.createElement('canvas');
        out.width = out.height = OUT;
        if (box) {
          const max = OUT - pad * 2;
          const scale = Math.min(max / box.w, max / box.h);
          const tw = Math.max(1, Math.round(box.w * scale)), th = Math.max(1, Math.round(box.h * scale));
          const scaled = scaleTo(cell, box.x, box.y, box.w, box.h, tw, th, true);
          out.getContext('2d').drawImage(scaled, Math.floor((OUT - tw) / 2), Math.floor((OUT - th) / 2));
        }
      }
      results.push({ name, folder: sheet.folder, canvas: out });
    }
  }
  render();
  $('saveDir').disabled = !window.showDirectoryPicker;
  $('saveZip').disabled = false;
  $('status').textContent = `Sliced ${results.length} sprites${hasAlpha ? ' (real transparency detected)' : ''}.`;
}

// AI sheets are rarely perfectly even: place each cut at the emptiest
// line near where the ideal grid line would be.
function findCuts(prof, count, search = 0.3) {
  const n = prof.length, step = n / count;
  const smooth = prof.map((_, i) => {
    let s = 0, k = 0;
    for (let j = i - 2; j <= i + 2; j++) if (j >= 0 && j < n) { s += prof[j]; k++; }
    return s / k;
  });
  const cuts = [0];
  for (let k = 1; k < count; k++) {
    const ideal = k * step;
    const lo = Math.max(cuts[k - 1] + 1, Math.floor(ideal - step * search));
    const hi = Math.min(n - 1, Math.floor(ideal + step * search));
    let best = Infinity, pick = Math.round(ideal);
    for (let x = lo; x < hi; x++) {
      if (smooth[x] < best - 0.5 || (Math.abs(smooth[x] - best) <= 0.5 && Math.abs(x - ideal) < Math.abs(pick - ideal))) {
        if (smooth[x] < best - 0.5) best = smooth[x];
        pick = x;
      }
    }
    cuts.push(pick);
  }
  cuts.push(n);
  return cuts;
}

function detectAlpha(data) {
  const d = data.data;
  let transparent = 0;
  for (let i = 3; i < d.length; i += 4 * 97) if (d[i] < 250) transparent++;
  return transparent > (d.length / (4 * 97)) * 0.05;
}

// Most common colours along the image border (quantised).
function borderColors(data, count) {
  const { width: W, height: H, data: d } = data;
  const freq = new Map();
  const add = (x, y) => {
    const i = (y * W + x) * 4;
    const k = (d[i] >> 3) << 10 | (d[i + 1] >> 3) << 5 | (d[i + 2] >> 3);
    const e = freq.get(k) || { n: 0, r: 0, g: 0, b: 0 };
    e.n++; e.r += d[i]; e.g += d[i + 1]; e.b += d[i + 2];
    freq.set(k, e);
  };
  for (let x = 0; x < W; x++) { add(x, 0); add(x, 1); add(x, H - 1); add(x, H - 2); }
  for (let y = 0; y < H; y++) { add(0, y); add(1, y); add(W - 1, y); add(W - 2, y); }
  return [...freq.values()].sort((a, b) => b.n - a.n).slice(0, count)
    .map(e => [e.r / e.n, e.g / e.n, e.b / e.n]);
}

// Flood fill from cell edges, clearing pixels close to a background colour.
function floodRemove(cell, keys, tol) {
  const { width: W, height: H, data: d } = cell;
  const t2 = tol * tol;
  const isBg = p => {
    const i = p * 4;
    if (d[i + 3] === 0) return true;
    for (const k of keys) {
      const dr = d[i] - k[0], dg = d[i + 1] - k[1], db = d[i + 2] - k[2];
      if (dr * dr + dg * dg + db * db <= t2) return true;
    }
    return false;
  };
  const seen = new Uint8Array(W * H);
  const stack = [];
  for (let x = 0; x < W; x++) stack.push(x, (H - 1) * W + x);
  for (let y = 0; y < H; y++) stack.push(y * W, y * W + W - 1);
  while (stack.length) {
    const p = stack.pop();
    if (seen[p]) continue;
    seen[p] = 1;
    if (!isBg(p)) continue;
    d[p * 4 + 3] = 0;
    const x = p % W;
    if (x > 0) stack.push(p - 1);
    if (x < W - 1) stack.push(p + 1);
    if (p >= W) stack.push(p - W);
    if (p < W * (H - 1)) stack.push(p + W);
  }
}

function bounds(cell) {
  const { width: W, height: H, data: d } = cell;
  let minX = W, minY = H, maxX = -1, maxY = -1;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (d[(y * W + x) * 4 + 3] > 40) {
      if (x < minX) minX = x; if (x > maxX) maxX = x;
      if (y < minY) minY = y; if (y > maxY) maxY = y;
    }
  }
  return maxX < 0 ? null : { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

function scaleTo(cell, sx, sy, sw, sh, tw, th, hardAlpha) {
  const tmp = document.createElement('canvas');
  tmp.width = cell.width; tmp.height = cell.height;
  tmp.getContext('2d').putImageData(cell, 0, 0);
  const out = document.createElement('canvas');
  out.width = tw; out.height = th;
  const ctx = out.getContext('2d');
  const nearest = $('nearest').checked;
  ctx.imageSmoothingEnabled = !nearest;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(tmp, sx, sy, sw, sh, 0, 0, tw, th);
  if (hardAlpha) {
    const px = ctx.getImageData(0, 0, tw, th);
    const d = px.data;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 128) d[i + 3] = 0;
      else {
        // un-premultiply edge darkening from smoothing
        const a = d[i + 3] / 255;
        d[i] = Math.min(255, d[i] / a); d[i + 1] = Math.min(255, d[i + 1] / a); d[i + 2] = Math.min(255, d[i + 2] / a);
        d[i + 3] = 255;
      }
    }
    ctx.putImageData(px, 0, 0);
  }
  return out;
}

function render() {
  const cols = +$('cols').value;
  const grid = $('preview');
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  grid.innerHTML = '';
  for (const r of results) {
    const div = document.createElement('div');
    div.className = 'cell';
    const c = document.createElement('canvas');
    c.width = c.height = OUT;
    c.getContext('2d').drawImage(r.canvas, 0, 0);
    const s = document.createElement('span');
    s.textContent = r.name;
    div.append(c, s);
    grid.append(div);
  }
}

// ---------- saving ----------
const toBlob = c => new Promise(res => c.toBlob(res, 'image/png'));

$('saveDir').onclick = async () => {
  try {
    const root = await showDirectoryPicker({ mode: 'readwrite' });
    const dir = await root.getDirectoryHandle(results[0].folder, { create: true });
    for (const r of results) {
      const fh = await dir.getFileHandle(r.name + '.png', { create: true });
      const w = await fh.createWritable();
      await w.write(await toBlob(r.canvas));
      await w.close();
    }
    $('status').textContent = `Saved ${results.length} files into ${root.name}/${results[0].folder}/`;
  } catch (e) {
    if (e.name !== 'AbortError') $('status').textContent = 'Save failed: ' + e.message;
  }
};

$('saveZip').onclick = async () => {
  const zip = new JSZip();
  const folder = zip.folder(results[0].folder);
  for (const r of results) folder.file(r.name + '.png', await toBlob(r.canvas));
  const blob = await zip.generateAsync({ type: 'blob' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = results[0].folder + '.zip';
  a.click();
};
</script>
</body>
</html>
